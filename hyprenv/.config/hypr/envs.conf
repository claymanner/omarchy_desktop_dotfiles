# Extra env variables
# env = MY_GLOBAL_ENV,setting
env = OMARCHY_SCREENSHOT_DIR,$HOME/Nextcloud/Pictures/Screenshots
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = MOZ_DISABLE_RDD_SANDBOX,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Lock the session WITHOUT a DPMS display-off. On this NVIDIA + Intel-iGPU
# multi-monitor setup, `hyprctl dispatch dpms off` crashes the compositor
# (hyprlock SIGABRT + portal SIGSEGV -> stuck lock screen, needs sddm restart).
# omarchy-system-lock honors this flag to skip its `omarchy-brightness-display
# off` step. Backstops the keybind override (bindings.conf) + hypridle lock_cmd.
env = OMARCHY_LOCK_ONLY,true
