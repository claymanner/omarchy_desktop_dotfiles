# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Wayland: refresh WAYLAND_DISPLAY from the attaching client into new panes.
# Without this, tmux's update-environment omits it, so children (notably
# Claude Code's `wl-paste` image read on Ctrl+V) can't reach the compositor
# and image paste silently fails. Text paste is unaffected (compositor-typed).
set -ga update-environment WAYLAND_DISPLAY

#Set bar to top
set-option -g status-position top

# Set mod key to ctrl-F
unbind C-b
set -g prefix C-f
bind-key C-f send-prefix

# Split windows with v and s
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Vim style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload Config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Cheatsheet popup
unbind ?
bind ? display-popup -E -h 80% -w 60% -T " tmux cheatsheet " "less ~/.config/tmux/cheatsheet.txt"

# Open/copy a URL or file path from the visible pane (prefix + u -> fzf popup; enter opens, ctrl-y copies)
bind u display-popup -E -w 80% -h 60% -T " open url / file " "$HOME/.config/tmux/scripts/url-open"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

#Allow scrolling in window
set -g mouse on

# Smart scrolling: enter copy mode on scroll up, but hand the wheel straight to
# the pane whenever something in it is actually listening for mouse events.
# mouse_any_flag covers nvim AND -- the case that matters over ssh -- a REMOTE
# tmux, which turns mouse reporting on and so wants the wheel itself. Without it
# the local tmux swallows every scroll into its own copy-mode and the far end
# never sees one, which makes scrollback look broken inside an ssh session.
bind -n WheelUpPane \
  if-shell -Ft= "#{||:#{mouse_any_flag},#{||:#{m:*nvim*,#{pane_current_command}},#{pane_in_mode}}}" \
    "send-keys -M" \
    "copy-mode -e; send-keys -M"

# Both branches of the old if-shell here were identical -- scroll down is always
# just handed to the pane (in copy-mode that scrolls down and eventually exits).
bind -n WheelDownPane send-keys -M

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alt-number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Window and session management
bind c new-window -c "#{pane_current_path}"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Tokyonight Moon theme colors
thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
# 3s, not 1s: these status formats shell out to ps for agent detection; at 1s
# a transient ps stall (memory pressure / wedged /proc) snowballs into a fork
# storm. The scripts also self-guard with flock. See scripts/agent-window-label.
set -g status-interval 3
set -gw automatic-rename on
set -gw automatic-rename-format '#($HOME/.config/tmux/scripts/pane-label "#{pane_pid}" "#{pane_current_command}" "#{pane_current_path}" "#{pane_title}" short)'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"
setw -g pane-border-status off

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator " "
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"
set-hook -g after-select-window 'run-shell -b "$HOME/.config/tmux/scripts/agent-window-ack \"#{window_id}\" \"#W\" long 5 \"#{E:automatic-rename}\""'
set-hook -g after-select-pane 'run-shell -b "$HOME/.config/tmux/scripts/agent-window-ack \"#{window_id}\" \"#W\" long 5 \"#{E:automatic-rename}\""'
set-hook -g session-window-changed 'run-shell -b "$HOME/.config/tmux/scripts/agent-window-ack \"#{window_id}\" \"#W\" long 5 \"#{E:automatic-rename}\""'

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_bg}#,bg=${thm_blue}#,bold] #I #($HOME/.config/tmux/scripts/agent-window-label \"#{window_id}\" \"#W\" long 5 \"#{E:automatic-rename}\" 1) "

# Statusline - other windows
set -g window-status-format "#[fg=${thm_fg}#,bg=${thm_bg}] #I #($HOME/.config/tmux/scripts/agent-window-label \"#{window_id}\" \"#W\" long 5 \"#{E:automatic-rename}\" 0) "

# Statusline - right side: prefix indicator + SSH host when active
set -g status-right "#{?client_prefix,#[fg=${thm_bg}#,bg=${thm_magenta}#,bold] PREFIX ,}#{?#{==:#{pane_current_command},ssh},#[fg=${thm_bg}#,bg=${thm_yellow}#,bold] #{pane_title} ,}"

# Statusline - left side: session name only
set -g status-left "#[fg=${thm_bg},bg=${thm_cyan},bold] #S #[fg=${thm_cyan},bg=${thm_bg}] "

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
